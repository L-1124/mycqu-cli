[package]
name = "mycqu-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lints.clippy]
all = "warn"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
rpassword = "7.5.4"
rsmycqu = { git = "https://github.com/L-1124/rsmycqu", features = ["card"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
rust-embed = "8.11"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
